name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Tests (Testcontainers)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: JDK setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, & verify coverage
        run: ./mvnw -B -ntp clean verify

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  compose-stack:
    name: Compose stack test
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: orderflow
      DB_PASSWORD: orderflow
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Run compose stack test suite
        run: docker compose --profile test run --build --rm test

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
