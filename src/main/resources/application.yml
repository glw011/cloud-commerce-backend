server:
  shutdown: graceful

spring:
  application:
    name: orderflow
  jpa:
    open-in-view:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db

app:
  security:
    jwt:
      issuer: orderflow
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  order:
    tax-rate: 0.08               # default flat rate until tax calculator added
    reservation-ttl: 30m         # reservation duration

logging:
  level:
    org.springframework.data.repository.config: WARN
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"